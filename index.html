<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    /* Startup intro on the home pages ("/" and "/en/"): on the first visit of a
       session and on every reload, not when navigating within the site, for
       #section links or reduced motion; add ?intro to the URL to replay it. The page stays hidden until
       src/useIntro.ts takes over; the timeout shows it anyway if that never happens. */
    (function () {
      try {
        var d = document.documentElement;
        var force = /[?&]intro\b/.test(location.search); /* ?intro replays it on demand */
        /* every reload (normal or hard: browsers report both as "reload") replays it */
        var nav = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
        var reload = nav ? nav.type === "reload" : performance.navigation && performance.navigation.type === 1;
        if (location.hash || (sessionStorage.getItem("site:intro") && !force && !reload)) return;
        if (!/^\/(en(\/(index\.html)?)?|index\.html)?$/.test(location.pathname)) return;
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        d.classList.add("intro-pending");
        setTimeout(function () { d.classList.remove("intro-pending"); }, 2500);
      } catch (e) {}
    })();
  </script>
  <!--app-head-->
  <meta name="theme-color" content="#0b0f14" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
